services:
  conduit-mysql:
    image: mysql:8.4
    container_name: conduit-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: conduit_dev
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - conduit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-phpmyadmin:
    image: phpmyadmin:5
    container_name: conduit-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: conduit-mysql
    ports:
      - "8081:80"
    depends_on:
      conduit-mysql:
        condition: service_healthy

volumes:
  conduit-mysql-data:

services:
  conduit-mysql:
    image: mysql:8.4
    container_name: conduit-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-conduit}
      MYSQL_USER: ${DB_USER:-conduit}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, run make docker/env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required, run make docker/env}
    volumes:
      - conduit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-backend:
    build:
      context: ../conduit-backend
      dockerfile: ../conduit-docker/conduit-backend/Dockerfile
    image: conduit-backend:local
    container_name: conduit-backend
    restart: unless-stopped
    environment:
      APP_LEVEL: ${APP_LEVEL:-development}
      DATABASE_URL: jdbc:mysql://conduit-mysql:3306/${DB_NAME:-conduit}?connectionTimeZone=UTC
      DATABASE_USER: ${DB_USER:-conduit}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required, run make docker/env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      conduit-mysql:
        condition: service_healthy

volumes:
  conduit-mysql-data:

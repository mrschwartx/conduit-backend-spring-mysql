services:
  taskly-mysql:
    image: mysql:8.4
    container_name: taskly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd!
      MYSQL_DATABASE: taskly_dev
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_pass
    ports:
      - "3306:3306"
    volumes:
      - taskly-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  taskly-phpmyadmin:
    image: phpmyadmin:5
    container_name: taskly-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: taskly-mysql
    ports:
      - "8081:80"
    depends_on:
      taskly-mysql:
        condition: service_healthy

volumes:
  taskly-mysql-data: